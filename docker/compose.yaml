services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /workspace
    volumes:
      - ..:/workspace
    stdin_open: true
    tty: true
    command: ["bash"]

  runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    entrypoint: ["/usr/local/bin/pixal3d"]
    command: ["--help"]
